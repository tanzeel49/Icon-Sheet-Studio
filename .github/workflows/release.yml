name: 'Publish release'

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: install Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: install frontend dependencies
        run: bun install

      - name: build frontend
        run: bun run build

      - name: tauri action
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: 'Icon Sheet Studio v__VERSION__'
          releaseBody: 'See the assets to download this version and install.'
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}

      - name: Upload Updater Artifacts
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          $tag = "${{ github.ref_name }}"
          $nsisZip = Get-Item "src-tauri/target/release/bundle/nsis/*.nsis.zip" | Select-Object -First 1
          $nsisSig = Get-Item "src-tauri/target/release/bundle/nsis/*.nsis.zip.sig" | Select-Object -First 1
          
          if ($nsisZip -and $nsisSig) {
            $sigContent = Get-Content $nsisSig.FullName -Raw
            $json = @{
              version = "v$version"
              notes = "Update available"
              pub_date = (Get-Date).ToString("yyyy-MM-ddTHH:mm:ssZ")
              platforms = @{
                "windows-x86_64" = @{
                  signature = $sigContent
                  url = "https://github.com/tanzeel49/Icon-Sheet-Studio/releases/download/$tag/$($nsisZip.Name)"
                }
              }
            } | ConvertTo-Json -Depth 5
            
            Set-Content -Path "latest.json" -Value $json
            
            gh release upload $tag $nsisZip.FullName $nsisSig.FullName latest.json --clobber
          } else {
            Write-Error "Could not find updater zip or sig file."
          }
